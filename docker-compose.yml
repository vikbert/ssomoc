version: '3'

services:
  siam:
      # git clone https://bitbucket.schwarz/scm/~zhoux/siam-oauth2-fake-server.git siam
      build: ./docker/siam
      image: siamoc:latest
      working_dir: /var/www
      volumes:
          - ./docker/siam:/var/www
          - ./docker/siam:/bindmount:rw
      ports:
          - "1234:1234"
  php:
      build: ./docker/php
      image: base-alpine-php:7.4
      extra_hosts:
          - "host.docker.internal:host-gateway"
      volumes:
          - ./app:/var/www:cached

  nginx:
      build: ./docker/nginx
      image: base-nginx:latest
      volumes:
          - ./app:/var/www:cached
          - ./logs/nginx:/var/log/nginx:cached
      ports:
          - "80:80"
          - "443:443"
  db:
    build: ./docker/db
    image: base-db:latest
    environment:
      POSTGRES_USER: ssomoc
      POSTGRES_PASSWORD: ssomoc
      POSTGRES_DB: ssomoc
    ports: [2345:5432]
    restart: always


